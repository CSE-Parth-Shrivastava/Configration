spring:
  application:
    name: ServerGateway

  cloud:
    discovery:
      enabled: true

    gateway:
      server:
        webflux:
          routes:
            - id: PRODUCT
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/products/**

            - id: ORDER
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
