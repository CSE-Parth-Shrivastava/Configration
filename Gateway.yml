spring.application.name=ServerGateway
server.port=8085

eureka.client.service-url.defualtZone=http://localhost:8761/eureka
spring.cloud.discovery.enabled=true

spring.cloud.gateway.server.webflux.routes[0].id=PRODUCT
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/products/**

spring.cloud.gateway.server.webflux.routes[1].id=ORDER
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/orders/**

